body: "Outer-dark stillness where ancient cold gathers beyond sight. Yuggoth is a dark, trans-Neptunian world (often equated with Pluto or a distant planet beyond the solar system's orbital plane) that serves as a mining base and staging ground for the extraterrestrial Mi-Go. To visit Yuggoth would drive any weak man mad; yet I am going there. The black rivers of pitch that flow under those mysterious Cyclopean bridges, things built by some elder race extinct and forgotten before the things came to Yuggoth from the ultimate voids, ought to be enough to make any man a Dante or Poe if he can keep sane long enough to tell what he has seen."

