# _template_precursor.yml
# Reusable PoC template for read -> brick -> strip -> post (legal YAML = pass)
schema: "lego_soft_precursor_v0"
id: "change_me_id"
base: "reddit"
motif: "change_me_motif"          # e.g., yuggoth | this_town
target: "change_me_target"        # e.g., chamber | magazine
milestone: "raw"                  # correlated to harness pass; kept untouched on input

body: "Minimal core copy for PoC."

media:
  video: null                     # e.g., assets/example.mp4 (used on fancy tier)
  alt_text: null                  # used when media is present

link: null                        # e.g., https://ledante.com (used on fancy tier)

# Optional / skippable bricks in PoC (null or empty = skipped)
control: null
tags: []
closer: null
wenwu: null

# Invisible ink & gates (stripped on export unless listed in _exceptions)
_gates:
  allow_template_to_publish: false
  web_sense_eligible: false
_mianzi_shim:
  mode: "springloaded_no_mianzi_required"
  status: "mock_pass"
_exceptions: []